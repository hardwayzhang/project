[DSMemProfiler]
; Interval in seconds between automatic memory snapshots
SnapshotIntervalSec=10.0

; Start the periodic monitor automatically at server startup
AutoStart=true

; Write CSV and JSON snapshot files to Saved/MemProfiler/
WriteCSVToDisk=true

; Warn if a module's live memory grows by more than this many MiB in one interval
WarnThresholdMiB=50
